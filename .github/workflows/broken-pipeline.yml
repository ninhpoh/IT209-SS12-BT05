
  name: Broken Pipeline - Fixed

  on:
    push:
      branches:
        - main
    pull_request:
      branches:
        - main
    workflow_dispatch:

  permissions:
    contents: read

  jobs:
    build-and-test:
      name: Build and Test
      runs-on: ubuntu-latest

      steps:
        - name: Checkout source code
          uses: actions/checkout@v4

        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'

        # FIX 1: Grant execution permission to Gradle Wrapper
        - name: Fix Gradle Wrapper Permission
          run: chmod +x gradlew

        - name: Build and Test with Gradle
          run: ./gradlew clean test bootJar

        # FIX 2: Use the correct GitHub Secret names
        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.REGISTRY_TOKEN }}

        # FIX 3: Specify the correct Docker build context and file
        - name: Build and Push Docker Image
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./Dockerfile
            push: false
